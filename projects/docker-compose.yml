services:
  mysql:
    image: mysql:8.4
    container_name: securities-simulator-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-securities_simulator}
      MYSQL_USER: ${MYSQL_USER:-simulator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-simulator_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
